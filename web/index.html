<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe6cf" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='none' stroke='%23111713' stroke-width='1.5'/%3E%3Cpath d='M3 11 V5 H8' fill='none' stroke='%23111713' stroke-width='1.2'/%3E%3C/svg%3E" />
    <title>AgroScore · Demo maní</title>
    <style>
      body { margin: 0; background: #efe6cf; color: #111713; font-family: Georgia, "Times New Roman", serif; }
      .aviso-ejemplo { background: #8e1528; color: #fffdf8; text-align: center; font-weight: 700; padding: .8rem 1rem; font-size: 1rem; line-height: 1.35; font-family: system-ui, sans-serif; }
      .top { display: flex; justify-content: space-between; align-items: flex-end; gap: .6rem; padding: .85rem 1.4rem .6rem; color: #111713; border-bottom: 3px double #111713; font-family: system-ui, sans-serif; }
      .marca { font-weight: 600; font-size: 1.45rem; line-height: 1; }
      .marca small { display: block; font-weight: 500; font-size: .875rem; margin-top: .25rem; font-family: ui-monospace, monospace; }
      main { max-width: 1280px; margin: 0 auto; padding: 1.15rem 1.3rem 2rem; }
      .sk { background: #e5d8bc; }
      .sk-title { height: 36px; width: min(480px, 90%); margin: .3rem 0 .7rem; }
      .sk-line { height: 16px; width: min(640px, 100%); margin-bottom: .8rem; border-top: 1px solid #111713; border-bottom: 1px solid #111713; background: transparent; }
      .sk-map { height: min(460px, 62vw); border: 1px solid #111713; }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="aviso-ejemplo">Cargando lotes…</div>
      <header class="top"><div class="marca">AgroScore <small>cuaderno de campo · demo maní</small></div></header>
      <main>
        <div class="sk sk-title"></div>
        <div class="sk sk-line"></div>
        <div class="sk sk-map"></div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
